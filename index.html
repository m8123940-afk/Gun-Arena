const off={on:0,round:0,liveAt:0,sc:{},pl:[],ending:0,
 start(){const f=FM[fmt];this.on=1;this.round=0;this.sc={};this.pl=[{id:0,team:0,name:'Вы'}];let id=1;
  if(f.f)for(;id<f.f;id++)this.pl.push({id,team:id,name:BN[id]});else{for(;id<f.a;id++)this.pl.push({id,team:0,name:BN[id]});for(let j=0;j<f.b;j++,id++)this.pl.push({id,team:1,name:BN[id]})}
  this.pl.forEach(p=>this.sc[p.team]=0);this.nextRound()},
 nextRound(){this.round++;this.ending=0;this.liveAt=T()+3000;const f=FM[fmt],best=Math.max(0,...this.pl.filter(p=>p.team!==0).map(p=>this.sc[p.team]));
  onMsg({t:'round',n:this.round,map:+$('map').value<0?Math.floor(Math.random()*4):+$('map').value,me:0,myTeam:0,players:this.pl,sp:spawnMap(this.pl,f.f),score:[this.sc[0],best],lbl:f.f?'Лучший':'Враги'});
  ens.forEach(e=>{e.w=GUNS[Math.floor(Math.random()*GUNS.length)];e.tt=0;e.sh=Math.random()})},
 handle(m){if(m.t!=='hit'||T()<this.liveAt||this.ending||!me.alive)return;const e=ens.find(x=>x.id===m.to);if(!e||!e.alive||e.team===0)return;const w=W[m.w];
  this.dmg(e,(m.w===11?m.d:m.w===6&&m.b?100:w.dmg*(m.n-m.h)+w.dmg*w.head*m.h)*(m.w===11?1:1+.06*(m.u||0)),0)},
 dmg(e,d,by){e.hp-=d;onMsg({t:'hp',id:e.id,hp:Math.max(0,e.hp)});if(e.hp<=0)this.kill(by,e.id)},
 dmgMe(d,by){const hp=Math.max(0,me.hp-d);onMsg({t:'hp',id:0,hp});if(hp<=0)this.kill(by,0)},
 kill(by,to){onMsg({t:'kill',by,to});const t=new Set();ens.forEach(e=>e.alive&&t.add(e.team));if(me.alive)t.add(0);if(t.size>1||this.ending)return;this.ending=1;
  const w=[...t][0];if(w!==undefined){this.sc[w]++;if(this.sc[w]>=5){this.on=0;return onMsg({t:'end',win:w===0})}}setTimeout(()=>this.nextRound(),2500)},
 tick(dt){if(!this.on)return;const D=DF[diff],go=T()>=this.liveAt&&!this.ending,mul=FM[fmt].f?.7:1;
  for(const e of ens){if(!e.alive)continue;let tg=null,bd=1e9;const cand=ens.filter(x=>x.alive&&x.team!==e.team);if(me.alive&&e.team!==0)cand.push({id:0,x:me.x,y:me.y,z:me.z,isMe:1});
   for(const c of cand){const q=Math.hypot(c.x-e.x,c.z-e.z);if(q<bd){bd=q;tg=c}}
   if(go){e.tt-=dt;if(e.tt<=0){e.tt=1+Math.random()*1.5;if(tg&&Math.random()<.7){e.gx=tg.x+rnd()*10;e.gz=tg.z+rnd()*10}else{e.gx=rnd()*35;e.gz=rnd()*20}if(Math.random()<.4&&e.ground)e.vy=JUMP}const dx=e.gx-e.x,dz=e.gz-e.z,l=Math.hypot(dx,dz)||1;e.vx=dx/l*D.spd;e.vz=dz/l*D.spd}else{e.vx=e.vz=0}
   e.vy-=G*dt;const bx=e.x,bz=e.z;moveBox(e,dt,.35,1.8);if(go&&Math.hypot(e.x-bx,e.z-bz)<D.spd*dt*.2){if(e.ground)e.vy=JUMP;e.tt-=.6}e.tx=e.x;e.ty=e.y;e.tz=e.z;e.slide=0;
   if(tg){const px=tg.x-e.x,pz=tg.z-e.z,dist=Math.hypot(px,pz)||1;e.ty2=Math.atan2(-px,-pz);e.pitch=0;
    if(go){e.sh-=dt;if(e.sh<=0){e.sh=D.rate+Math.random()*.25;const o={x:e.x,y:e.y+1.6,z:e.z},tz=(tg.y||0)+1.2,d={x:px/dist,y:(tz-o.y)/dist,z:pz/dist};
     if(dist<70&&rayMap(o,d,dist)>=dist-.3){onMsg({t:'fire',id:e.id,w:0});if(Math.random()<D.hit*mul){if(tg.isMe)this.dmgMe(D.dmg,e.id);else this.dmg(tg,D.dmg,e.id)}}}}}}}};
// ---------- loop ----------
function loop(){requestAnimationFrame(loop);const now=T(),dt=Math.min(.033,(now-last)/1e3);last=now;
 update(dt,now);off.tick(dt);nadeTick(dt);
 const k=Math.min(1,dt*15);for(const e of ens){e.x+=(e.tx-e.x)*k;e.y+=(e.ty-e.y)*k;e.z+=(e.tz-e.z)*k;let dy=e.ty2-e.yaw;dy=Math.atan2(Math.sin(dy),Math.cos(dy));e.yaw+=dy*k;const q=e.m;q.visible=state==='play';q.position.set(e.x,e.y,e.z);q.rotation.y=e.yaw;animChar(q,dt,Math.hypot(e.tx-e.x,e.tz-e.z)/Math.max(dt,.001),e.pitch,e.slide,e.alive,k);if(q.userData.gid!==e.w)setGun(q,e.w)}
 for(let i=tracers.length-1;i>=0;i--){const t=tracers[i];if((t.life-=dt)<=0){scene.remove(t.l);t.l.geometry.dispose();tracers.splice(i,1)}}
 if(state==='play'){if(now<frozen)$('msg').textContent=Math.ceil((frozen-now)/1e3);else if(now>msgT)$('msg').textContent='';
  if(!off.on&&now>netT&&net.ws&&net.ws.readyState===1){netT=now+50;net.send({t:'st',p:[me.x,me.y,me.z],yaw:me.yaw,pitch:me.pitch,w:slots[cur],s:me.slide})}
  if(!reloadEnd&&ammo[cur]>=0)$('ammo').textContent!=='Перезарядка...'||hud()}
 if(state==='menu')lobbyRender(dt);else ren.render(scene,cam)}
// ---------- input & menu ----------
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='Space')e.preventDefault();if(state!=='play')return;
 if(e.code==='Digit1')setSlot(0);if(e.code==='Digit2')setSlot(1);if(e.code==='Digit3')setSlot(2);if(e.code==='KeyR')reload(T());if(e.code==='KeyQ')setSlot(cur===2?0:2);if(e.code==='KeyG'&&nades)aiming=1});
addEventListener('keyup',e=>{keys[e.code]=0;if(e.code==='KeyG'&&aiming){aiming=0;throwNade()}});
addEventListener('mousedown',e=>{if(!document.pointerLockElement)return;if(e.button===0){mL=1;click=1}if(e.button===2)mR=1});
addEventListener('mouseup',e=>{if(e.button===0)mL=0;if(e.button===2)mR=0});addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('mousemove',e=>{if(!document.pointerLockElement||!me.alive)return;const s=sens*(W[slots[cur]].zoom&&mR?.4:1);me.yaw-=e.movementX*s;me.pitch=Math.max(-1.5,Math.min(1.5,me.pitch-e.movementY*s))});
document.addEventListener('pointerlockchange',()=>{const l=!!document.pointerLockElement;if(state==='play'){$('pause').classList.toggle('hide',l);$('pt').textContent=$('pt').textContent==='МАТЧ НАЙДЕН'?'МАТЧ НАЙДЕН':'ПАУЗА'}});
$('pause').onclick=()=>{ren.domElement.requestPointerLock();$('pt').textContent='ПАУЗА'};
$('name').value=SV.nick;$('srv').value=location.protocol.startsWith('http')?(location.protocol==='https:'?'wss://':'ws://')+location.host:'ws://localhost:3000';
function setup(){sens=$('sens').value*.00055;diff=+$('diff').value;ut=SV.ut;applyMode(0,1)}
$('sens').oninput=()=>sens=$('sens').value*.00055;
$('bBot').onclick=()=>{setup();ren.domElement.requestPointerLock();off.start()};
$('bOn').onclick=()=>{setup();const st=$('st');st.textContent='Подключение...';let ws;try{ws=new WebSocket($('srv').value.trim())}catch(e){st.textContent='Неверный адрес';return}
 ws.onopen=()=>{net.ws=ws;ws.send(JSON.stringify({t:'queue',name:$('name').value||'Игрок',f:fmt}));st.textContent='Поиск соперника...'};
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}onMsg(m)};
 ws.onerror=()=>st.textContent='Сервер недоступен. Запусти server (см. README) или играй с ботом';
 ws.onclose=()=>{if(state==='play')onMsg({t:'end',win:false})}};
init();loop();
})();
</script></body></html>
